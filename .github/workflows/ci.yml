name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in engine/*.js gnome/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test 'engine/test/*.test.mjs'

  gnome:
    name: GNOME extension
    runs-on: ubuntu-latest
    env:
      UUID: ball-on-a-string@local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests against the shell mock
        run: node --test 'gnome/test/*.test.mjs'
      - name: Install GJS, GTK 4, libadwaita, Xvfb, GNOME Shell schemas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gjs gir1.2-adw-1 gir1.2-gtk-4.0 xvfb gnome-shell-common
      - name: Preferences window under Xvfb
        run: bash gnome/test/prefs-xvfb.sh

      # The install/uninstall checks run in a throwaway HOME with no GNOME Shell,
      # i.e. the situation of a first install. GSettings uses the keyfile backend
      # so no D-Bus session is needed.
      - name: Install
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          GSETTINGS_BACKEND: keyfile
        run: |
          EXT="$HOME/.local/share/gnome-shell/extensions/$UUID"
          mkdir -p "$(dirname "$EXT")"
          ln -s "$GITHUB_WORKSPACE" "$EXT"                       # pre-existing symlinked layout
          gsettings set org.gnome.shell disabled-extensions "['$UUID']"

          PATH=/usr/bin:/bin bash gnome/install.sh

          test -f "$EXT/physics.js"
          test -x "$HOME/.local/bin/balls"
          test -f "$XDG_CONFIG_HOME/ball-on-a-string.json"
          "$HOME/.local/bin/balls" off
          grep -q '"visible": false' "$XDG_CONFIG_HOME/ball-on-a-string.json"

          # Enabled for the next login without a manual `gnome-extensions enable`.
          gsettings get org.gnome.shell enabled-extensions | grep -q "'$UUID'"
          ! gsettings get org.gnome.shell disabled-extensions | grep -q "'$UUID'"

          # Re-running is idempotent.
          PATH=/usr/bin:/bin bash gnome/install.sh
          test "$(gsettings get org.gnome.shell enabled-extensions | grep -o "$UUID" | wc -l)" = 1

      - name: Uninstall
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          GSETTINGS_BACKEND: keyfile
        run: |
          EXT="$HOME/.local/share/gnome-shell/extensions/$UUID"
          CONFIG="$XDG_CONFIG_HOME/ball-on-a-string.json"

          PATH=/usr/bin:/bin bash gnome/install.sh --uninstall
          test ! -e "$EXT"
          test ! -e "$HOME/.local/bin/balls"
          test -f "$CONFIG"                                      # settings survive
          ! gsettings get org.gnome.shell enabled-extensions | grep -q "'$UUID'"

          PATH=/usr/bin:/bin bash gnome/install.sh --uninstall --purge
          test ! -e "$CONFIG"

          # A symlinked extension dir: only the link goes, never the project behind it.
          ln -s "$GITHUB_WORKSPACE" "$EXT"
          PATH=/usr/bin:/bin bash gnome/install.sh --uninstall
          test ! -L "$EXT" && test -f "$GITHUB_WORKSPACE/gnome/install.sh"

          ! bash gnome/install.sh --bogus

  macos:
    name: macOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Tests
        run: swift test
      - name: Assemble the .app
        run: |
          bash build.sh
          test -x "build/Ball on a String.app/Contents/MacOS/BallOnAString"
          test -f "build/Ball on a String.app/Contents/Resources/physics.js"
          plutil -lint "build/Ball on a String.app/Contents/Info.plist"
      - name: Uninstall
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          CONFIG="$HOME/.config/ball-on-a-string.json"
          mkdir -p "$(dirname "$CONFIG")" && echo '{}' > "$CONFIG"

          bash build.sh --uninstall
          test ! -e "build/Ball on a String.app"
          test -f "$CONFIG"                                      # settings survive

          bash build.sh --uninstall --purge
          test ! -e "$CONFIG"

          ! bash build.sh --bogus